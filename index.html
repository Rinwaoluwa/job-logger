<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Logger</title>
    <script>
      // The stored theme, before first paint (see src/hooks/useTheme.js).
      (function () {
        try {
          var t = localStorage.getItem("ui.theme");
          if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        } catch (e) { /* private window etc */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
